services:
  mediamtx:
    image: bluenviron/mediamtx:1
    container_name: web-stream-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"   # RTSP output for FFmpeg
      - "8889:8889"   # WebRTC / WHIP HTTP
      - "8189:8189/udp" # WebRTC media
    volumes:
      - ./mediamtx.local.yml:/mediamtx.yml:ro
